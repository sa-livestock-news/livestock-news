<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>南米畜産ニュース 2026年05月07日</title>
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); background: #f0f2f5; color: #1a1a2e; line-height: 1.7; font-size: 15px; }
    a { color: #1565c0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header {
      background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #1565c0 100%);
      color: white; padding: 28px 24px 24px; text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }
    header h1 { font-size: clamp(20px, 4vw, 32px); font-weight: 700; margin-bottom: 6px; }
    .header-sub { font-size: 14px; opacity: 0.85; margin-top: 4px; }
    .header-stats { display: flex; justify-content: center; gap: 20px; margin-top: 14px; flex-wrap: wrap; }
    .stat-badge {
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.35);
      border-radius: 20px; padding: 5px 14px; font-size: 13px; font-weight: 600;
    }
    .toc {
      background: white; padding: 14px 20px; display: flex; gap: 10px;
      flex-wrap: wrap; align-items: center; border-bottom: 1px solid #e0e0e0;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .toc-label { font-size: 12px; color: #666; font-weight: 600; }
    .toc-item {
      background: #e8eaf6; color: #283593; border-radius: 16px;
      padding: 4px 12px; font-size: 13px; font-weight: 600;
    }
    .toc-item:hover { background: #c5cae9; text-decoration: none; }
    .toc-archive {
      margin-left: auto; background: #e8f5e9; color: #2e7d32;
      border-radius: 16px; padding: 4px 12px; font-size: 13px; font-weight: 600;
    }
    .toc-archive:hover { background: #c8e6c9; text-decoration: none; }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px 40px; }
    .country-section { margin-bottom: 32px; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    .country-header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: white; font-weight: 700; }
    .country-flag { font-size: 28px; line-height: 1; }
    .country-name { font-size: 20px; flex: 1; }
    .country-count { background: rgba(255,255,255,0.25); border-radius: 12px; padding: 2px 10px; font-size: 13px; }
    .country-body { padding: 16px; border: 1px solid; border-top: none; }
    .article-card {
      background: white; border-radius: var(--radius); padding: 20px;
      margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); position: relative;
    }
    .article-card:last-child { margin-bottom: 0; }
    .article-num {
      position: absolute; top: 12px; right: 14px; background: #1a237e; color: white;
      border-radius: 50%; width: 28px; height: 28px; display: flex;
      align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
    }
    .article-source-badge {
      display: inline-block; background: #e8eaf6; color: #283593;
      border-radius: 4px; padding: 2px 8px; font-size: 11px; font-weight: 700; margin-bottom: 8px;
    }
    .article-title-ja {
      font-size: 17px; font-weight: 700; color: #1a237e; margin-bottom: 6px;
      line-height: 1.5; cursor: pointer;
    }
    .article-title-ja:hover { color: #1565c0; text-decoration: underline; }
    .article-title-orig { font-size: 13px; font-weight: 400; color: #555; margin-bottom: 10px; }
    .article-title-orig a { color: #1565c0; }
    .article-meta {
      display: flex; gap: 14px; flex-wrap: wrap;
      font-size: 12px; color: #666; margin-bottom: 10px;
    }
    .meta-link { color: #1565c0 !important; font-weight: 600; }
    .meta-fulltext {
      color: #e65100 !important; font-weight: 600; cursor: pointer;
      border: 1px solid #ffcc80; border-radius: 10px; padding: 1px 8px;
      background: #fff3e0;
    }
    .meta-fulltext:hover { background: #ffe0b2; }
    .keywords { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .keyword {
      background: #fff3e0; color: #e65100; border: 1px solid #ffcc80;
      border-radius: 12px; padding: 2px 9px; font-size: 11px; font-weight: 600;
    }
    .article-body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px; }
    @media (max-width: 640px) { .article-body-grid { grid-template-columns: 1fr; } }
    .body-col { background: #fafafa; border-radius: 6px; padding: 12px; border: 1px solid #e8e8e8; }
    .body-label { font-size: 11px; font-weight: 700; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .body-text { font-size: 13px; line-height: 1.7; color: #333; }
    .body-text.ja { color: #1a1a2e; }
    .back-link { margin-top: 12px; font-size: 13px; }
    footer {
      text-align: center; padding: 20px; font-size: 12px; color: #888;
      border-top: 1px solid #e0e0e0; background: white; margin-top: 32px;
    }

    /* モーダル */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 1000; overflow-y: auto;
      padding: 20px;
    }
    .modal.active { display: flex; align-items: flex-start; justify-content: center; }
    .modal-content {
      background: white; border-radius: 12px; padding: 28px;
      max-width: 800px; width: 100%; margin: 20px auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); position: relative;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; gap: 16px; }
    .modal-title { font-size: 20px; font-weight: 700; color: #1a237e; line-height: 1.5; flex: 1; }
    .modal-close {
      background: #f5f5f5; border: none; border-radius: 50%; width: 32px; height: 32px;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: #555;
    }
    .modal-close:hover { background: #e0e0e0; }
    .modal-meta { display: flex; gap: 14px; font-size: 13px; color: #666; margin-bottom: 20px; flex-wrap: wrap; }
    .modal-meta a { color: #1565c0; font-weight: 600; }
    .modal-section-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .modal-body { background: #f0f4ff; border-radius: 8px; padding: 16px; margin-bottom: 16px; border-left: 4px solid #1565c0; }
    .modal-orig { background: #fafafa; border-radius: 8px; padding: 16px; border: 1px solid #e8e8e8; }
    .modal-text { font-size: 14px; line-height: 1.8; color: #1a1a2e; white-space: pre-wrap; }
    .modal-text.orig { color: #555; }

    @media print {
      .toc { display: none; }
      .article-card { break-inside: avoid; }
      body { background: white; }
    }
  </style>
</head>
<body>

  <script>
    function openModal(id) {
      document.getElementById(id).classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal.active').forEach(function(m) {
          m.classList.remove('active');
          document.body.style.overflow = '';
        });
      }
    });
  </script>
</body>
</html>
